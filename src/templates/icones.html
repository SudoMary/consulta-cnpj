{# Ícone de cada gravidade de situação: a cor nunca aparece sozinha. #}
{% macro situacao(gravidade) -%}
{% if gravidade == "ok" -%}
<svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm-1 10.2L3.8 8l1.1-1.1L7 9l4.1-4.1 1.1 1.1L7 11.2Z"/></svg>
{%- elif gravidade == "grave" -%}
<svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm2.8 8.7-1.1 1.1L8 9.1l-1.7 1.7-1.1-1.1L6.9 8 5.2 6.3l1.1-1.1L8 6.9l1.7-1.7 1.1 1.1L9.1 8l1.7 1.7Z"/></svg>
{%- elif gravidade == "alerta" -%}
<svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8.9 1.6a1 1 0 0 0-1.8 0L.6 13.4A1 1 0 0 0 1.5 15h13a1 1 0 0 0 .9-1.6L8.9 1.6ZM7.2 5.5h1.6v4.6H7.2V5.5Zm0 5.9h1.6V13H7.2v-1.6Z"/></svg>
{%- else -%}
<svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="currentColor"/></svg>
{%- endif %}
{%- endmacro %}

{% macro aviso() -%}
<svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8.9 1.6a1 1 0 0 0-1.8 0L.6 13.4A1 1 0 0 0 1.5 15h13a1 1 0 0 0 .9-1.6L8.9 1.6ZM7.2 5.5h1.6v4.6H7.2V5.5Zm0 5.9h1.6V13H7.2v-1.6Z"/></svg>
{%- endmacro %}
